{{- if not .Values.existingSecret }}
{{- $name := include "kca.name" . -}}
# A chart-managed Secret. DEVELOPMENT ONLY.
#
# WHY THIS IS THE WRONG PATH FOR PRODUCTION
# ========================================
# The values that fill this come from a values file, and values files end up in git. Even when they do
# not, they end up in CI logs, in `helm get values` output for anyone with release read access, and in
# the Helm release Secret itself -- which stores the full rendered manifest, so the password is
# recoverable by anyone who can read Secrets in the namespace whether or not they can read this one.
#
# The production path is `existingSecret`: create the Secret out of band -- from a sealed-secret, External
# Secrets Operator, a cloud secret manager, or by hand -- and this template renders nothing at all.
#
# Kept because a chart you cannot install in kind is a chart nobody tests, and the alternative is an
# undocumented manual step that people get wrong.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  labels:
    {{- include "kca.labels" . | nindent 4 }}
  annotations:
    # A visible marker, so `kubectl get secret -o yaml` says what this is rather than looking like the
    # intended arrangement.
    kca.dev/warning: "chart-managed secret: development only. Use existingSecret in production."
type: Opaque
stringData:
  {{/*
    stringData rather than data, so the values are not base64 in the template.
    
    base64 is NOT encryption and pretending otherwise is how a "secret" ends up pasted into a chat. Plain
    text here makes the exposure obvious, which is the honest rendering of what this actually is.
  */}}
  database-url: {{ required "either existingSecret or secrets.databaseUrl must be set" .Values.secrets.databaseUrl | quote }}
  # Empty is permitted: config.Validate allows an unauthenticated API outside production and refuses it
  # when APP_ENV=production, so the strict check lives in the code where it applies to every deployment
  # method rather than only to Helm.
  api-keys: {{ .Values.secrets.apiKeys | quote }}
{{- if .Values.postgresql.enabled }}
  postgres-password: {{ required "secrets.postgresPassword is required when postgresql.enabled" .Values.secrets.postgresPassword | quote }}
{{- end }}
{{- end }}
