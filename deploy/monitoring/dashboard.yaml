# The Grafana dashboard, as code.
#
# WHY A ConfigMap AND NOT THE GRAFANA UI
# =====================================
# A dashboard built by clicking is a production artefact with no diff, no review and no history. It
# survives exactly as long as the Grafana database, and when somebody drags a panel at 02:00 during an
# incident nobody can tell what it looked like before. Worse, the queries in it drift from the queries in
# the alert rules, so the dashboard says the service is fine while the alert says it is not -- and the
# argument becomes about which one is right instead of about the outage.
#
# THE PROVISIONING MECHANISM, verified on this cluster rather than assumed: the kps-grafana Deployment
# runs a `grafana-sc-dashboard` sidecar configured with LABEL=grafana_dashboard, LABEL_VALUE=1 and
# RESOURCE=both. So a ConfigMap carrying that label, in any namespace, is picked up and written into
# Grafana's provisioning directory. No API calls, no credentials, no Terraform provider.
#
# WHY THE PANELS USE THE RECORDED SERIES
# Every latency and error-rate panel reads `job:...` recording rules rather than re-deriving the
# expression. That is the consistency argument from rules.yaml in practice: one definition, shared by the
# alert and the panel, so they cannot disagree.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kca-dashboard
  namespace: monitoring
  labels:
    # The label the sidecar watches for. Without it the ConfigMap is inert and nothing says so.
    grafana_dashboard: "1"
    app.kubernetes.io/name: kubernetes-cost-analyzer
data:
  kca-overview.json: |
    {
      "title": "Kubernetes Cost Analyzer",
      "uid": "kca-overview",
      "tags": ["kca", "cost"],
      "timezone": "utc",
      "editable": false,
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "templating": { "list": [] },
      "panels": [
        {
          "type": "row",
          "title": "Is the data trustworthy?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "type": "stat",
          "title": "Data age",
          "description": "How old the newest collected window is. THE FIRST PANEL ON THE DASHBOARD BY DESIGN: every cost figure below is only as good as this number, and a stale cluster reads as ZERO cost rather than as missing data.",
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "targets": [{ "expr": "kca:facts_age_seconds", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 600 },
                  { "color": "red", "value": 900 }
                ]
              }
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "Rollup age",
          "description": "Since the rollup job last wrote. Warns at 25h, not 24h: a nightly job must tolerate one full inter-run gap or it alarms every night just before it runs.",
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "targets": [{ "expr": "kca:rollup_age_seconds", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 90000 }
                ]
              }
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "Nodes priced by guess",
          "description": "Instance types missing from the pricing catalogue. Non-zero means part of every figure below is arithmetic on an invented price.",
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "targets": [{ "expr": "kca_pricing_fallback_priced_nodes", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 }
                ]
              }
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "stat",
          "title": "Targets up",
          "description": "Scrapes Prometheus is completing. If this drops, every other panel here is BLIND rather than reassuring: the series go stale, so nothing fires and nothing resolves.",
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "targets": [{ "expr": "count(up{job=~\".*kca.*\"} == 1)", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 2 }
                ]
              }
            }
          },
          "options": { "colorMode": "background", "graphMode": "none", "textMode": "value" }
        },
        {
          "type": "row",
          "title": "Collection",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 },
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Cycle outcomes",
          "description": "PARTIAL is the one to watch. internal/costing isolates a failing namespace and carries on, so a cycle can finish having measured less of the cluster than it should -- and a persistently partial collector does NOT advance the last-success timestamp, deliberately, so it still trips the freshness alert.",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 7 },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(kca_collector_cycles_total[15m]))",
              "legendFormat": "{{outcome}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "failed" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } }]
              },
              {
                "matcher": { "id": "byName", "options": "partial" },
                "properties": [{ "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }]
              }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "timeseries",
          "title": "Cycle duration vs collection interval",
          "description": "The number that matters is whether p99 is approaching the interval. Once a cycle takes longer than the interval, cycles overlap and the collector falls behind FOREVER -- and it never recovers on its own.",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 7 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(kca_collector_cycle_duration_seconds_bucket[15m])))",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(kca_collector_cycle_duration_seconds_bucket[15m])))",
              "legendFormat": "p50",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "row",
          "title": "API (RED)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Request rate by route",
          "description": "The route label is the registered PATTERN, not the URL path -- so a query string does not mint a new series. Nine routes is the cardinality ceiling, bounded by the router itself.",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 15 },
          "targets": [
            {
              "expr": "sum by (route) (rate(kca_http_requests_total[5m]))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "timeseries",
          "title": "Error ratio",
          "description": "Reads the RECORDED series job:kca_http_error_ratio:rate5m -- the same expression the alert uses, so this panel and the alert cannot disagree about what the error rate is. The `or vector(0)` inside it stops an idle service producing NaN, which would compare FALSE and silently prevent the alert from ever firing.",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 15 },
          "targets": [{ "expr": "job:kca_http_error_ratio:rate5m", "legendFormat": "5xx ratio", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "timeseries",
          "title": "Latency and saturation",
          "description": "p99 and p50 from the recorded series, with in-flight requests. Rising latency with FLAT in-flight is a slow dependency; rising latency WITH rising in-flight is queueing. That distinction is why the saturation gauge shares this panel rather than living elsewhere.",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 15 },
          "targets": [
            { "expr": "job:kca_http_request_duration_seconds:p99", "legendFormat": "p99", "refId": "A" },
            { "expr": "job:kca_http_request_duration_seconds:p50", "legendFormat": "p50", "refId": "B" },
            { "expr": "kca_http_requests_in_flight", "legendFormat": "in flight", "refId": "C" }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "in flight" },
                "properties": [
                  { "id": "unit", "value": "short" },
                  { "id": "custom.axisPlacement", "value": "right" }
                ]
              }
            ]
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "row",
          "title": "Cost (approximate — Postgres is the system of record)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "collapsed": false
        },
        {
          "type": "timeseries",
          "title": "Cluster cost, trailing hour",
          "description": "FLOAT64, exposed for alerting only. Prometheus cannot hold an exact decimal, and this project keeps money out of floats everywhere else -- so the authoritative figure comes from /api/v1/costs/summary, which carries exact decimals as strings all the way to the browser. Note a STALE cluster reads as zero here, which is why the cost alerts are gated on data freshness.",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 23 },
          "targets": [{ "expr": "kca_cost_cluster_hourly", "legendFormat": "cost/hour", "refId": "A" }],
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "timeseries",
          "title": "Wasted resource, trailing hour",
          "description": "Reserved but not used, floored PER CONTAINER before summing. Summing first and subtracting would let an under-requested container credit against real waste -- the Phase 6 bug that reported a namespace holding 50 GiB-hours of waste as having none.",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 23 },
          "targets": [
            {
              "expr": "kca_cost_cluster_wasted_hours",
              "legendFormat": "{{resource}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 2, "fillOpacity": 10, "showPoints": "never" }
            }
          },
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } }
        },
        {
          "type": "row",
          "title": "Process health",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 },
          "collapsed": true,
          "panels": [
            {
              "type": "timeseries",
              "title": "Goroutines",
              "description": "Unbounded growth is the leak signature. Both binaries run informers and worker pools, either of which can produce one.",
              "gridPos": { "h": 7, "w": 12, "x": 0, "y": 31 },
              "targets": [
                { "expr": "go_goroutines{job=~\".*kca.*\"}", "legendFormat": "{{job}}", "refId": "A" }
              ],
              "fieldConfig": {
                "defaults": { "custom": { "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" } }
              }
            },
            {
              "type": "timeseries",
              "title": "Open file descriptors",
              "description": "Against the process limit. This is how a connection leak becomes visible BEFORE it becomes a refused request.",
              "gridPos": { "h": 7, "w": 12, "x": 12, "y": 31 },
              "targets": [
                { "expr": "process_open_fds{job=~\".*kca.*\"}", "legendFormat": "{{job}} open", "refId": "A" },
                { "expr": "process_max_fds{job=~\".*kca.*\"}", "legendFormat": "{{job}} limit", "refId": "B" }
              ],
              "fieldConfig": {
                "defaults": { "custom": { "lineWidth": 2, "fillOpacity": 0, "showPoints": "never" } }
              }
            }
          ]
        }
      ]
    }
