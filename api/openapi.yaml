# OpenAPI description of the Kubernetes Cost Analyzer API.
#
# WHY HAND-WRITTEN RATHER THAN GENERATED FROM CODE
# ------------------------------------------------
# Code-first generators (swaggo, huma, goa) cannot drift from the implementation, which is a real
# advantage and the reason most teams eventually adopt one. The cost is that the contract stops
# being a reviewed artefact: it becomes an output, and nobody reads a diff of a generated file.
#
# For a learning project the contract is the point, so it is written by hand and kept honest by a
# test that asserts the enum values here match the allow-lists the code actually enforces --
# see TestOpenAPISpec_MatchesTheCode. That gives most of the drift protection without hiding the
# design.
#
# WHY VERSIONED FROM THE FIRST ENDPOINT
# /api/v1 was there before there was anything to version. Adding it later means either breaking
# every client or maintaining an unversioned alias forever, and "we will version it when we need
# to" is how teams end up doing both.

openapi: 3.1.0

info:
  title: Kubernetes Cost Analyzer
  version: "1.0.0"
  description: |
    Attributes Kubernetes spend to the teams, namespaces and workloads that cause it.

    Cost is billed on `max(requested, used)`, not on requests alone. A BestEffort container
    declares no requests, so a request-only formula would price it at zero while it consumes real
    CPU and memory -- and that cost would be silently smeared across every other team's share.

    **Monetary values are JSON strings, not numbers.** A JSON number is parsed as an IEEE-754
    double by every JavaScript client, which would reintroduce the imprecision that `numeric(20,10)`
    in the database and `decimal.Decimal` in the service exist to prevent. Format them for display;
    never do arithmetic on them client-side.

    **Check `rate_source` and `estimated_rates`.** A cost derived from a fallback rate for an
    unrecognised instance type is an estimate. It is reported rather than hidden, and it must not be
    presented as a real figure.

servers:
  - url: http://localhost:8080
    description: Local development

security:
  # Applies to every operation unless overridden. The probes below override it to none, because the
  # kubelet cannot present a credential -- requiring one there would make every probe fail and kill
  # the container.
  - bearerAuth: []

tags:
  - name: cost
    description: What things cost.
  - name: inventory
    description: Live cluster topology, read from the informer cache.
  - name: operations
    description: Probes and build information.

paths:
  /healthz:
    get:
      tags: [operations]
      summary: Liveness probe
      description: |
        Checks NOTHING and returns 200 unconditionally.

        That is the correct implementation, not laziness. Failing liveness makes the kubelet KILL
        the container, so the only question it should answer is "is this process so broken that a
        restart is the remedy?" A restart fixes a deadlock; it does not fix an unreachable database,
        and trying makes a brief dependency blip into a cluster-wide restart storm.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /readyz:
    get:
      tags: [operations]
      summary: Readiness probe
      description: |
        Reports whether this replica can serve traffic, with per-dependency detail.

        Failing removes the pod from Service endpoints WITHOUT restarting it, so traffic drains and
        returns automatically once the dependency recovers.

        Returns 503, not 500: the service is working correctly and temporarily cannot serve.

        **Must not be exposed through a public ingress** -- the response includes dependency error
        strings, which can name internal hosts.
      security: []
      responses:
        "200":
          description: Every dependency is usable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }
        "503":
          description: At least one dependency is unusable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReport" }

  /version:
    get:
      tags: [operations]
      summary: Which build is running
      description: |
        **Requires authentication**, unlike the probes. An audit found this documented as `security: []`
        while the server returned 401 for it -- the spec was wrong, not the code.

        The probe exemption exists because the kubelet cannot present a credential and a 401 on a probe
        kills the container. Nothing probes `/version`, so it gains nothing from being open, and build
        version and commit are precisely what an attacker fingerprints to find known CVEs in a
        dependency tree.
      responses:
        "200":
          description: Build metadata injected at link time.
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string, example: "2ff2824" }
                  commit: { type: string, example: "2ff2824" }
                  build_time: { type: string, format: date-time }

  /api/v1/costs/summary:
    get:
      tags: [cost]
      summary: Aggregated cost over a time range
      description: |
        The primary reporting endpoint. Aggregates cost across a half-open range `[from, to)`,
        grouped by one dimension.

        `totals` is summed from the rows actually returned, so the headline figure can never
        disagree with the rows beneath it. When `totals.truncated` is true the row set was cut short
        by `limit` and the totals cover only what was returned.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: group_by
          in: query
          description: The dimension to aggregate by.
          schema:
            type: string
            default: namespace
            # Kept in step with postgres.GroupByOptions() by TestOpenAPISpec_MatchesTheCode.
            enum:
              - capacity_type
              - container
              - cost_centre
              - environment
              - instance_type
              - namespace
              - node
              - pod
              - team
              - workload
        - name: sort
          in: query
          description: Which value to order by.
          schema:
            type: string
            default: total_cost
            enum:
              - cpu_cost
              - cpu_core_hours
              - dimension
              - memory_cost
              - total_cost
              - wasted_cpu_core_hours
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: limit
          in: query
          description: |
            Maximum rows. **Refused, not clamped**, if too large: silently returning 100 rows to a
            caller who asked for 10,000 would make them believe they had the whole result set.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Team"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/CostCentre"
        - $ref: "#/components/parameters/WorkloadKind"
        - $ref: "#/components/parameters/WorkloadName"
        - $ref: "#/components/parameters/Node"
        - $ref: "#/components/parameters/InstanceType"
        - $ref: "#/components/parameters/CapacityType"
        - $ref: "#/components/parameters/EstimatedOnly"
      responses:
        "200":
          description: The aggregated cost.
          headers:
            Cache-Control:
              description: |
                `private, max-age=60`. Private rather than public: these responses are scoped to
                whoever authenticated, and a shared proxy caching one caller's report and serving it
                to another would be a data leak.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CostSummaryResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/allocations:
    get:
      tags: [cost]
      summary: Raw per-container cost samples, cursor-paginated
      description: |
        The rows a summary was computed from. Use this when a figure looks wrong: it returns
        requested, used AND billable separately, so the `max(requested, used)` rule is visible
        rather than implied.

        **Cursor pagination, not offset.** Offset would make Postgres scan and discard N rows, and
        it is inconsistent under concurrent writes -- the collector appends every five minutes, so
        rows shift between requests and a client silently sees a duplicate or misses one. A cursor
        asks for "rows after this exact position", which is an index range scan and stable.

        The cursor is **opaque**. Do not parse it: its internal shape may change, and a client that
        depends on it has coupled itself to our primary key. Follow `next_cursor` until it is absent.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: cursor
          in: query
          description: Opaque position from a previous response's `next_cursor`. Omit for the first page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Team"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/CostCentre"
        - $ref: "#/components/parameters/WorkloadKind"
        - $ref: "#/components/parameters/WorkloadName"
        - $ref: "#/components/parameters/Node"
        - $ref: "#/components/parameters/InstanceType"
        - $ref: "#/components/parameters/CapacityType"
        - $ref: "#/components/parameters/EstimatedOnly"
      responses:
        "200":
          description: One page of allocations.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllocationsResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/recommendations:
    get:
      tags: [cost]
      summary: What to change, and what it would save
      description: |
        Turns observed behaviour into actionable advice. Five rules: right-size, idle, under-requested,
        set-requests and over-replicated.

        **`estimated_monthly_saving` can be NEGATIVE.** An under-requested container needs a LARGER
        request, which costs more. A tool whose advice is all one-directional is not trusted with
        production, so the increase is reported honestly -- and `totals` separates savings from
        required increases rather than netting them, so a large saving cannot hide a reliability fix.

        **Severity is not ordered by money.** A memory under-request risking an OOM kill is `critical`
        even though acting on it costs money; a large saving on a batch job is merely `info`.

        **Silence is a valid answer.** Every rule refuses to fire without enough evidence -- a minimum
        window count, a minimum observation span, and trustworthy peak data. Recommending a deletion
        from twenty minutes of data collected overnight would be worse than saying nothing.

        The default range is **7 days**, wider than the cost endpoints' 24 hours: a recommendation from
        one day cannot see a weekly pattern, so a job that runs on Sundays would look abandoned.
      parameters:
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Team"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/CostCentre"
        - $ref: "#/components/parameters/WorkloadKind"
        - $ref: "#/components/parameters/WorkloadName"
        - $ref: "#/components/parameters/Node"
        - $ref: "#/components/parameters/InstanceType"
        - $ref: "#/components/parameters/CapacityType"
      responses:
        "200":
          description: The recommendations, most urgent first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationsResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/costs/trend:
    get:
      tags: [cost]
      summary: Cost through time, from the daily rollup
      description: |
        The same question `/costs/summary` answers for one period, asked repeatedly.

        **Which table answers this is reported in `source`, and it is part of the contract.** The daily
        rollup is roughly 293x smaller than the fact table (measured), but it cannot answer every
        question, so the query is routed:

        | Request | Source | Why |
        |---|---|---|
        | `interval=day\|week\|month` | `daily_rollup` | the rollup's grain is a day, so these aggregate from it exactly |
        | `interval=hour` | `raw_facts` | there is no hourly data in the rollup to read |
        | `group_by=pod\|container` | `raw_facts` | pod is the one groupable dimension the rollup drops |

        The two sources agree for any question both can serve — there is a test asserting exactly that —
        but they differ in what they *can* serve, and the rollup only covers days the rollup job has
        processed. So a rollup-sourced series can legitimately stop short of today, and a client
        comparing this against `/costs/summary` needs to know which it got.

        **`window_count` on every point is not decoration.** A bucket with a tenth of its neighbours'
        window count is a collection gap, not a cost saving, and on a chart those look identical.
      parameters:
        - name: interval
          in: query
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
          description: |
            Bucket width. `hour` is limited to 14 days: it reads the fact table, and 336 points is
            already the practical ceiling for a line chart.
        - name: from
          in: query
          schema: { type: string, format: date-time }
          description: |
            Inclusive lower bound, RFC3339. Defaults to 30 days ago — wider than the cost endpoints'
            24 hours and the recommendation endpoint's 7 days, because a trend with two points is not
            a trend.
        - name: to
          in: query
          schema: { type: string, format: date-time }
          description: Exclusive upper bound, RFC3339. Defaults to now.
        - name: group_by
          in: query
          schema:
            type: string
            enum: [namespace, team, environment, cost_centre, workload, node, instance_type, capacity_type, pod, container]
            default: namespace
          description: One series per distinct value of this dimension.
        - name: compare
          in: query
          schema:
            type: string
            enum: [previous_period, none]
            default: none
          description: |
            `previous_period` adds a comparison against the immediately preceding window of EQUAL
            length — not the previous calendar month, which is ambiguous for a 10-day range and makes
            a 31-day month look 3% dearer than a 30-day one.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
          description: |
            Caps SERIES, not points. A truncated series would draw a chart that stops partway through
            the range with nothing to say why.
        - $ref: "#/components/parameters/Namespace"
        - $ref: "#/components/parameters/Team"
        - $ref: "#/components/parameters/Environment"
        - $ref: "#/components/parameters/CostCentre"
        - $ref: "#/components/parameters/WorkloadKind"
        - $ref: "#/components/parameters/WorkloadName"
        - $ref: "#/components/parameters/Node"
        - $ref: "#/components/parameters/InstanceType"
        - $ref: "#/components/parameters/CapacityType"
      responses:
        "200":
          description: One series per group, each ordered oldest bucket first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/reports/monthly:
    get:
      tags: [cost]
      summary: Monthly statements, frozen once signed off
      description: |
        Not "what is true now" — **what we said**. Every other endpoint here is a view of current data.
        This one is stored, because a statement must not change after it is issued: backfill a missing
        day, correct a price, or fix a rollup bug, and a computed-on-demand figure for last August
        silently becomes a different number from the one somebody already reported.

        `finalised_at` is the line. `null` means provisional and regenerable; set means frozen — and
        frozen is enforced by database triggers, not only by the writer that happens to set it.

        **Read `coverage` before quoting any total.** A month containing a collector outage produces a
        figure that is confidently too low, and nothing about the figure itself reveals that. Coverage is
        `days_with_data / days_in_month`, so it is DAY-level: a day on which the collector ran for one
        hour counts as a full day. `window_count` is reported alongside for exactly that reason, and the
        daily trend is where a partial day is visible as a dip.

        Statements exist at three scopes. The gap between a cluster statement and the sum of its team
        statements IS the unattributed spend — cost whose containers carry no team label, which gets no
        team statement rather than one belonging to nobody.
      parameters:
        - name: from
          in: query
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
          description: |
            First month, as `YYYY-MM`. Defaults to 11 months ago. A timestamp is REFUSED rather than
            truncated to its month, because silently discarding the day answers a different question.
        - name: to
          in: query
          schema: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
          description: |
            Last month, `YYYY-MM`, **INCLUSIVE** — the one place this API is not half-open, and
            deliberately. A month is a label, not an instant, and "January to March" means three months
            to everyone who asks for it.
        - name: scope_kind
          in: query
          schema:
            type: string
            enum: [cluster, namespace, team]
          description: Omit to return all three scopes.
        - name: scope_value
          in: query
          schema: { type: string, maxLength: 253 }
          description: The namespace, team or cluster name to filter to.
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        "200":
          description: Statements, newest month first, largest cost first within a month.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MonthlyReportsResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/nodes:
    get:
      tags: [inventory]
      summary: Cluster nodes with their rates
      description: |
        Live node topology from the informer cache, with the per-resource rates the pricing engine
        derives for each.

        A node that cannot be priced is **still returned**, carrying `pricing.error`. Failing the
        whole request because one node in fifty has an unrecognised instance type would make the
        endpoint useless; omitting it silently would hide capacity that exists and costs money.
      responses:
        "200":
          description: Every node, up to the response limit.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/InventoryList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/namespaces:
    get:
      tags: [inventory]
      summary: Namespaces and their cost-allocation dimensions
      responses:
        "200":
          description: Every namespace, up to the response limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        # 429 and 500 were undocumented here and on /pods while /nodes listed them, though all three
        # share one middleware chain and one handler shape. An audit found the asymmetry: a client
        # generated from the spec would have had no branch for a rate-limited namespace listing.
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/pods:
    get:
      tags: [inventory]
      summary: Pods with requests, QoS class and resolved workload
      parameters:
        - name: namespace
          in: query
          description: Restrict to one namespace. Must be a DNS-1123 label.
          schema: { type: string }
      responses:
        "200":
          description: Matching pods, up to the response limit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryList" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        `Authorization: Bearer <key>`, or `X-API-Key: <key>`.

        Keys are configured via `API_KEYS` and compared in constant time against a SHA-256 digest --
        a plain `==` leaks the secret through timing, since it returns on the first differing byte.

        The API refuses to start in production with no keys configured. In development it starts
        with authentication disabled and warns loudly on every boot.

  parameters:
    From:
      name: from
      in: query
      description: |
        Start of the range, inclusive. RFC3339 **with a timezone**.

        One format only, deliberately: `01/02/2026` is January 2nd or February 1st depending on
        where the caller lives, and guessing wrong shifts a whole cost report by a month.

        Defaults to 24 hours before `to`.
      schema: { type: string, format: date-time, example: "2026-08-05T00:00:00Z" }
    To:
      name: to
      in: query
      description: |
        End of the range, **exclusive**. The range is half-open `[from, to)`, matching the collection
        windows -- a closed range would double-count the boundary window in two adjacent reports.

        Defaults to now. The range may span at most 400 days.
      schema: { type: string, format: date-time }
    Namespace:
      { name: namespace, in: query, schema: { type: string } }
    Team:
      { name: team, in: query, schema: { type: string } }
    Environment:
      { name: environment, in: query, schema: { type: string } }
    CostCentre:
      { name: cost_centre, in: query, schema: { type: string } }
    WorkloadKind:
      { name: workload_kind, in: query, schema: { type: string, example: Deployment } }
    WorkloadName:
      { name: workload_name, in: query, schema: { type: string } }
    Node:
      { name: node, in: query, schema: { type: string } }
    InstanceType:
      { name: instance_type, in: query, schema: { type: string, example: m5.large } }
    CapacityType:
      name: capacity_type
      in: query
      schema: { type: string, enum: [spot, on-demand] }
    EstimatedOnly:
      name: estimated_only
      in: query
      description: Return only rows priced from a fallback rate, to answer "how much of this bill is guessed?"
      schema: { type: boolean, default: false }

  schemas:
    InventoryList:
      type: object
      required: [items, count, total]
      description: |
        The envelope every inventory endpoint returns. One component rather than three inline copies:
        the three were duplicated, and an audit found they had already drifted -- two of them omitted
        the truncation fields and two omitted their 429 and 500 responses.
      properties:
        items:
          type: array
          items: { type: object }
        count:
          type: integer
          description: Items in THIS response. Equals `total` unless the response was truncated.
        total:
          type: integer
          description: |
            How many items existed BEFORE the limit was applied. Read this against `count`: a caller
            given 500 of 5,000 and not told would treat the 500 as the whole cluster.
        truncated:
          type: boolean
          description: |
            Present and true only when the response is incomplete. These endpoints were unbounded until
            a Phase 7 audit: at a measured 950 bytes per pod, and with the response buffered before
            writing, a 5,000-pod cluster meant 4.5 MiB allocated per request.

            Truncation keeps the first N of a stable order -- the informer's listers sort -- so two
            identical requests agree rather than returning different subsets.

    Money:
      type: string
      description: |
        An exact decimal as a STRING. A JSON number would be parsed as a double by every JavaScript
        client and lose precision. Format for display; do not compute with it.
      example: "0.0185500000"

    CostSummaryResponse:
      type: object
      required: [from, to, group_by, items, count, totals]
      properties:
        from:
          type: string
          format: date-time
          description: Echoed back, because a caller who omitted it received a default it never chose.
        to: { type: string, format: date-time }
        group_by: { type: string }
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/CostSummaryRow" }
        totals:
          type: object
          required:
            [
              total_cost,
              cpu_cost,
              memory_cost,
              cpu_billable_core_hours,
              memory_billable_gib_hours,
              wasted_cpu_core_hours,
              wasted_memory_gib_hours,
              estimated_rates,
              truncated,
            ]
          description: |
            The aggregate across every RETURNED row, computed server-side.

            **A client must not sum the rows itself**, for two independent reasons. These are exact
            decimals of up to 26 significant digits, so adding them in JavaScript means `parseFloat`
            and a silent truncation to a double that compounds across rows — the whole reason money
            crosses the wire as a string. And when `truncated` is true the returned rows are not the
            complete answer, so no amount of client-side care can produce the real figure.
          properties:
            total_cost: { $ref: "#/components/schemas/Money" }
            cpu_cost: { $ref: "#/components/schemas/Money" }
            memory_cost: { $ref: "#/components/schemas/Money" }
            cpu_billable_core_hours: { $ref: "#/components/schemas/Money" }
            memory_billable_gib_hours: { $ref: "#/components/schemas/Money" }
            wasted_cpu_core_hours:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: |
                The headline figure this API exists to report. Summed from per-row values that were each
                floored in SQL — never computed as a difference of totals, which would let an
                under-requested group credit against a wasteful one.
            wasted_memory_gib_hours: { $ref: "#/components/schemas/Money" }
            estimated_rates:
              type: boolean
              description: True if any returned group was priced from a fallback guess.
            truncated:
              type: boolean
              description: |
                True when `limit` cut the results short, meaning these totals cover only the rows
                returned. A partial total presented as complete is simply a wrong number.

    CostSummaryRow:
      type: object
      description: |
        Only the dimension fields relevant to the requested `group_by` are present.
      properties:
        namespace: { type: string }
        team: { type: string }
        environment: { type: string }
        cost_centre: { type: string }
        workload_kind: { type: string }
        workload_name: { type: string }
        node: { type: string }
        instance_type: { type: string }
        capacity_type: { type: string }
        pod_name: { type: string }
        container_name: { type: string }
        cpu_requested_core_hours: { $ref: "#/components/schemas/Money" }
        cpu_used_core_hours: { $ref: "#/components/schemas/Money" }
        cpu_billable_core_hours:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: max(requested, used). This is what cost is computed from.
        memory_requested_gib_hours: { $ref: "#/components/schemas/Money" }
        memory_used_gib_hours: { $ref: "#/components/schemas/Money" }
        memory_billable_gib_hours: { $ref: "#/components/schemas/Money" }
        wasted_cpu_core_hours:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: |
            requested minus used, **floored at zero**. Waste cannot be negative: a container using
            more than it requested is under-requested, which is a reliability problem rather than a
            saving, and allowing it negative would offset genuine waste elsewhere in a sum.
        wasted_memory_gib_hours: { $ref: "#/components/schemas/Money" }
        cpu_cost: { $ref: "#/components/schemas/Money" }
        memory_cost: { $ref: "#/components/schemas/Money" }
        total_cost: { $ref: "#/components/schemas/Money" }
        container_windows:
          type: integer
          description: How many container-window samples were aggregated. An unexpectedly small value usually means a filter matched less than intended.
        estimated_rates: { type: boolean }

    AllocationsResponse:
      type: object
      required: [from, to, items, count]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        count: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/AllocationRow" }
        next_cursor:
          type: string
          description: |
            **Absent** on the last page, so its presence answers "is there more?". An empty string
            would force every client to check for both absence and emptiness.

    TrendResponse:
      type: object
      required: [from, to, interval, group_by, source, series, count]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        interval:
          type: string
          enum: [hour, day, week, month]
        group_by: { type: string }
        source:
          type: string
          enum: [daily_rollup, raw_facts]
          description: |
            Which table answered. PART OF THE CONTRACT, not a debug field: the two sources cannot serve
            the same set of questions, and the rollup only covers days the rollup job has processed. A
            silent choice between them is how a system becomes unexplainable.
        count: { type: integer }
        series:
          type: array
          items: { $ref: "#/components/schemas/TrendSeries" }
        comparison:
          allOf: [{ $ref: "#/components/schemas/TrendComparison" }]
          description: Present only when `compare=previous_period` was requested.

    TrendSeries:
      type: object
      required: [group, points, total_cost]
      properties:
        group:
          type: object
          additionalProperties: { type: string }
          description: |
            The dimension values identifying this series, keyed by column. A map rather than eleven
            explicit fields, because a series is IDENTIFIED by its group rather than described by it --
            a chart legend wants a label, not a struct with ten empty fields.
        total_cost:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: The sum over the returned points, so it provably matches the line beneath it.
        points:
          type: array
          items: { $ref: "#/components/schemas/TrendPoint" }

    TrendPoint:
      type: object
      required: [bucket_start, total_cost, window_count]
      properties:
        bucket_start:
          type: string
          format: date-time
          description: Start of the bucket, half-open to the next one.
        total_cost: { $ref: "#/components/schemas/Money" }
        cpu_cost: { $ref: "#/components/schemas/Money" }
        memory_cost: { $ref: "#/components/schemas/Money" }
        cpu_billable_core_hours: { $ref: "#/components/schemas/Money" }
        memory_billable_gib_hours: { $ref: "#/components/schemas/Money" }
        wasted_cpu_core_hours: { $ref: "#/components/schemas/Money" }
        wasted_memory_gib_hours: { $ref: "#/components/schemas/Money" }
        window_count:
          type: integer
          format: int64
          description: |
            Samples aggregated into this bucket. **Read this alongside the cost.** A bucket with a tenth
            of its neighbours' window count is a collection gap, not a saving, and on a chart those two
            are indistinguishable.
        estimated_rates:
          type: boolean
          description: True when any rate behind this bucket was a fallback guess.

    TrendComparison:
      type: object
      required: [previous_from, previous_to, current_total_cost, previous_total_cost, change, comparable]
      properties:
        previous_from: { type: string, format: date-time }
        previous_to: { type: string, format: date-time }
        current_total_cost: { $ref: "#/components/schemas/Money" }
        previous_total_cost: { $ref: "#/components/schemas/Money" }
        change:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: current minus previous. Negative means it got cheaper.
        change_ratio:
          type: string
          nullable: true
          description: |
            `change / previous`, as a decimal fraction. **NULL when the previous period cost nothing**,
            because the ratio is then undefined -- "cost went from 0 to 5" is a real and common
            situation (a new workload) with no percentage increase. Rendering "+Inf%" or "+100%" would
            state something the data does not support.
        comparable:
          type: boolean
          description: |
            False when the two periods have materially different window counts, so part of the
            difference is missing data rather than changed cost. **This is the most misleading thing a
            trend can do:** a period during which collection started shows a large apparent increase
            that is purely an artefact of when the collector was deployed.
        note:
          type: string
          description: Why the comparison is not comparable, when it is not.

    MonthlyReportsResponse:
      type: object
      required: [items, count, provisional_count, lowest_coverage]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/MonthlyReport" }
        count: { type: integer }
        provisional_count:
          type: integer
          description: |
            How many of these are not yet frozen, which tells a reader whether the page can still
            change. A page mixing frozen and provisional rows without saying so invites someone to
            quote a number that is still moving.
        lowest_coverage:
          type: string
          description: |
            The WORST coverage among the returned statements, hoisted here because it is the easiest
            thing on this response to overlook and the most dangerous to miss. `0.0000` on an empty
            page: claiming perfect coverage of nothing would read as a real measurement.

    MonthlyReport:
      type: object
      required: [cluster, month, scope_kind, scope_value, total_cost, coverage, generated_at]
      properties:
        cluster: { type: string }
        month:
          type: string
          pattern: "^[0-9]{4}-[0-9]{2}$"
          example: "2026-07"
          description: |
            YYYY-MM, not a timestamp. A statement is for a month, and a date would invite a reader to
            wonder what happened at 00:00 on the 1st.
        scope_kind:
          type: string
          enum: [cluster, namespace, team]
        scope_value: { type: string }
        cpu_cost: { $ref: "#/components/schemas/Money" }
        memory_cost: { $ref: "#/components/schemas/Money" }
        total_cost: { $ref: "#/components/schemas/Money" }
        cpu_billable_core_hours: { $ref: "#/components/schemas/Money" }
        memory_billable_gib_hours: { $ref: "#/components/schemas/Money" }
        wasted_cpu_core_hours: { $ref: "#/components/schemas/Money" }
        wasted_memory_gib_hours: { $ref: "#/components/schemas/Money" }
        days_with_data: { type: integer }
        days_in_month: { type: integer }
        window_count: { type: integer, format: int64 }
        coverage:
          type: string
          description: |
            `days_with_data / days_in_month`. **DAY-level:** a day on which the collector ran for one
            hour counts as a full day, so read `window_count` alongside it and use the daily trend to
            see a partial day as a dip. Second-level coverage would need the collection interval of
            every historical day, which is not recorded.
        estimated_rates: { type: boolean }
        generated_at: { type: string, format: date-time }
        finalised_at:
          type: string
          format: date-time
          nullable: true
          description: |
            NULL while provisional. Once set the row is FROZEN by database trigger -- against every
            writer, not only the one that generates statements. This is what makes a statement
            quotable.

    RecommendationsResponse:
      type: object
      required: [from, to, items, count, totals, analysed_containers]
      properties:
        from: { type: string, format: date-time }
        to: { type: string, format: date-time }
        count: { type: integer }
        analysed_containers:
          type: integer
          description: |
            How many containers were examined. The denominator for "how much of my estate has
            findings" -- without it, three recommendations could mean a healthy cluster or a barely
            collected one.
        items:
          type: array
          items: { $ref: "#/components/schemas/Recommendation" }
        totals:
          type: object
          properties:
            potential_monthly_saving:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: Sum of the POSITIVE savings only.
            required_monthly_increase:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: |
                Sum of the reliability fixes that COST money, expressed positive. Kept separate from
                the savings rather than netted, so a large saving cannot hide a change someone must
                make.
            critical: { type: integer }
            warning: { type: integer }
            info: { type: integer }
            estimated_rates: { type: boolean }

    Recommendation:
      type: object
      properties:
        kind:
          type: string
          enum: [right_size, idle, under_requested, set_requests, over_replicated]
        severity:
          type: string
          enum: [info, warning, critical]
          description: |
            Not ordered by money. `critical` is reserved for reliability risk -- a memory
            under-request that may cause an OOM kill -- even though fixing it increases cost.
        confidence:
          type: string
          enum: [low, medium, high]
          description: |
            Based on observation SPAN, not sample count: a hundred windows over one hour still only
            describes that hour. `medium` covers a day, `high` covers a week.
        namespace: { type: string }
        workload_kind: { type: string }
        workload_name: { type: string }
        container_name:
          type: string
          description: Absent for workload-level findings such as over_replicated.
        summary: { type: string }
        rationale:
          type: string
          description: |
            The reasoning, with the numbers. A recommendation nobody understands is one nobody
            applies -- and one that cannot be argued with cannot be trusted either.
        current: { type: string, example: "cpu: 500m, memory: 512Mi" }
        proposed:
          type: string
          example: "cpu: 4m, memory: 16Mi"
          description: Formatted in Kubernetes units so it can be pasted into a manifest unchanged.
        estimated_monthly_saving:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: NEGATIVE when the recommendation costs money, which under_requested always does.
        estimated_rates: { type: boolean }
        evidence:
          type: object
          description: The observation behind the recommendation, so it can be checked rather than believed.
          properties:
            observed_from: { type: string, format: date-time }
            observed_to: { type: string, format: date-time }
            observed_hours: { type: number }
            windows: { type: integer }
            replicas: { type: integer }
            cpu_requested_millicores: { type: integer }
            cpu_avg_millicores:
              type: integer
              description: The cost-relevant statistic. NOT what right-sizing uses.
            cpu_p95_millicores:
              type: integer
              description: |
                p95 of the per-window PEAKS -- the right-sizing signal. p95 of averages would have the
                bursts smoothed out of it and would understate the true peak, so a request derived
                from it throttles the workload.
            cpu_max_millicores: { type: integer }
            memory_requested_bytes: { type: integer }
            memory_avg_bytes: { type: integer }
            memory_p95_bytes: { type: integer }
            memory_max_bytes: { type: integer }

    AllocationRow:
      type: object
      properties:
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        namespace: { type: string }
        pod_name: { type: string }
        container_name: { type: string }
        workload_kind: { type: string }
        workload_name: { type: string }
        node_name: { type: string }
        team: { type: string }
        cost_centre: { type: string }
        environment: { type: string }
        instance_type: { type: string }
        capacity_type: { type: string, enum: [spot, on-demand] }
        zone: { type: string }
        qos_class: { type: string, enum: [Guaranteed, Burstable, BestEffort] }
        cpu_millicores_requested: { type: integer }
        cpu_millicores_used: { type: integer }
        cpu_millicores_billable: { type: integer }
        memory_bytes_requested: { type: integer }
        memory_bytes_used: { type: integer }
        memory_bytes_billable: { type: integer }
        cpu_cost: { $ref: "#/components/schemas/Money" }
        memory_cost: { $ref: "#/components/schemas/Money" }
        total_cost: { $ref: "#/components/schemas/Money" }
        rate_source:
          type: string
          enum: [catalogue, explicit_rates, fallback]
          description: |
            How the rate was derived. `fallback` means the instance type was not in the catalogue and
            an approximate rate was used -- the figure is an estimate and must be presented as one.

    Node:
      type: object
      properties:
        name: { type: string }
        instance_type: { type: string }
        region: { type: string }
        zone: { type: string }
        capacity_type: { type: string, enum: [spot, on-demand] }
        capacity_cpu_millicores:
          type: integer
          description: What the instance has. **This is what you are billed for.**
        capacity_memory_bytes: { type: integer }
        allocatable_cpu_millicores:
          type: integer
          description: What the scheduler may hand out. Compute *utilisation* against this, not cost.
        allocatable_memory_bytes: { type: integer }
        ready: { type: boolean }
        unschedulable: { type: boolean }
        pricing:
          type: object
          properties:
            currency: { type: string, example: USD }
            node_hourly: { $ref: "#/components/schemas/Money" }
            cpu_per_core_hour: { $ref: "#/components/schemas/Money" }
            memory_per_gib_hour: { $ref: "#/components/schemas/Money" }
            source: { type: string, enum: [catalogue, explicit_rates, fallback] }
            error:
              type: string
              description: Present when the node could not be priced. The node is still returned.

    HealthReport:
      type: object
      properties:
        status: { type: string, enum: [up, down] }
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              status: { type: string, enum: [up, down] }
              error: { type: string }
              latency_ms: { type: integer }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                A stable machine-readable token. Branch on this. `message` is for humans and may be
                reworded at any time, so never match on it.
              enum: [invalid_parameter, unauthorized, rate_limited, internal_error]
            message: { type: string }
            request_id:
              type: string
              description: Quote this when reporting a problem; it turns a vague report into a one-query log lookup.
            fields:
              type: array
              description: Every invalid parameter, not just the first.
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }

  responses:
    ValidationError:
      description: |
        One or more parameters are invalid. Every problem is listed, so three bad parameters cost one
        round trip rather than three.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        No valid API key. The response deliberately does not distinguish missing from wrong -- that
        would tell an attacker their key is the right shape.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many requests. Honour `Retry-After`.
      headers:
        Retry-After:
          description: Seconds to wait. Without this a client can only guess, and most guess "immediately".
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: |
        Something failed server-side. The response is deliberately generic; the detail is in the logs
        against the `request_id`, because an error body can leak SQL, hostnames and internal paths.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
